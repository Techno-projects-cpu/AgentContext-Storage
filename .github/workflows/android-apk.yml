name: Build Namaz & Azan APK

# Builds an installable APK and runs the prayer-time accuracy tests.
# GitHub's public-repo runners ship with a full Android SDK at $ANDROID_HOME.
on:
  push:
    paths:
      - "works/apps/namaz-azan/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "works/apps/namaz-azan/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create a throwaway signing key
        # Lets the release APK install directly, and proves the release pipeline works.
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/namaz.jks" \
            -storepass namazazan -keypass namazazan \
            -alias namaz -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Namaz Azan, OU=Local, O=Local, L=Guntur, S=Andhra Pradesh, C=IN"
          echo "NAMAZ_KEYSTORE=$RUNNER_TEMP/namaz.jks" >> "$GITHUB_ENV"

      - name: Unit tests — prayer time accuracy
        working-directory: works/apps/namaz-azan
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        working-directory: works/apps/namaz-azan
        run: gradle --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp works/apps/namaz-azan/app/build/outputs/apk/release/*.apk out/
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # An Artifacts download is always a zip, so say so in the name.
          name: namaz-azan-apk.zip
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

  # Pushes the built APK into the repo so it can be downloaded with one click,
  # without a GitHub login and without unzipping an artifact.
  publish-apk:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: namaz-azan-apk.zip
          path: /tmp/apk

      - name: Commit the APK
        run: |
          mkdir -p works/apps/namaz-azan/release
          # One APK in the repo, not one per release.
          #
          # Without this the release/ folder keeps every build forever — two ~1 MB
          # binaries after two releases, and a clone that grows by a megabyte each
          # time. The history still has the old ones if they are ever needed.
          rm -f works/apps/namaz-azan/release/*.apk
          cp /tmp/apk/app-release.apk works/apps/namaz-azan/release/namaz-azan-1.1.1.apk
          ls -la works/apps/namaz-azan/release/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `rm` deletes the file from the working tree but git still tracks it, so
          # the deletion has to be staged explicitly or the commit only adds the new
          # APK and the old one stays in the folder. -A on the whole directory.
          git add -A -f works/apps/namaz-azan/release/
          git commit -m "release: Namaz & Azan 1.1.1 APK [skip ci]" || exit 0
          git push

  # Publishes the APK as a Release asset. A release asset downloads directly with the
  # file's real name and extension — unlike an Actions artifact, which arrives as a zip.
  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: namaz-azan-apk.zip
          path: /tmp/apk

      - name: Name the asset properly
        run: |
          mkdir -p dist
          cp /tmp/apk/app-release.apk dist/namaz-azan-1.1.1.apk
          ls -la dist/

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: namaz-azan-v1.1.1
          name: Namaz & Azan 1.1.1 — Android APK
          body_path: works/apps/namaz-azan/RELEASE_NOTES.md
          files: dist/namaz-azan-1.1.1.apk
          fail_on_unmatched_files: true
