name: Build Namaz & Azan APK

# Produces an installable APK.
# Runs on GitHub's free runners (public repo), which ship with a full Android SDK at
# $ANDROID_HOME already, so no SDK download step is needed.
on:
  push:
    paths:
      - "works/apps/namaz-azan/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOG: works/apps/namaz-azan/build-log.txt
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME" || true
            java -version 2>&1 | head -3
          } | tee "$LOG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/namaz.jks" \
            -storepass namazazan -keypass namazazan \
            -alias namaz -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Namaz Azan, OU=Local, O=Local, L=Guntur, S=Andhra Pradesh, C=IN" 2>&1 | tee -a "$LOG"
          echo "NAMAZ_KEYSTORE=$RUNNER_TEMP/namaz.jks" >> "$GITHUB_ENV"

      - name: Unit tests (prayer time accuracy)
        id: test
        working-directory: works/apps/namaz-azan
        run: gradle --no-daemon testDebugUnitTest 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG" || exit 1

      - name: Build APK
        id: apk
        working-directory: works/apps/namaz-azan
        run: gradle --no-daemon assembleRelease 2>&1 | tee -a "$GITHUB_WORKSPACE/$LOG" || exit 1

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp works/apps/namaz-azan/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out/ | tee -a "$LOG"
          test -n "$(ls -A out)" || { echo "NO APK PRODUCED" | tee -a "$LOG"; exit 1; }

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namaz-azan-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish the build log to the branch
        # The sandbox that wrote this app cannot read Actions logs, so the log is
        # committed where it can be read. Remove this step once the build is green.
        if: always()
        run: |
          if [ -s "$LOG" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$LOG"
            git commit -m "ci: build log [skip ci]" || exit 0
            git push || true
          fi
