name: diag
on:
  push:
    paths:
      - "works/apps/namaz-azan/diag.txt"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile tests and dump output
        working-directory: works/apps/namaz-azan
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest > build.log 2>&1
          echo "exit=$?" >> build.log
      - uses: actions/upload-artifact@v4
        with:
          name: buildlog
          path: works/apps/namaz-azan/build.log
          if-no-files-found: error
