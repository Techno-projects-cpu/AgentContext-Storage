name: diag
on:
  push:
    paths:
      - "works/apps/namaz-azan/diag.txt"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/60e296ba-agentcontext-storage
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and capture output into the repo
        run: |
          set +e
          cd works/apps/namaz-azan
          gradle --no-daemon testDebugUnitTest --console=plain > buildlog.txt 2>&1
          echo "exit=$?" >> buildlog.txt
          grep -cE "^e: " buildlog.txt >> buildlog.txt
      - name: Commit the log
        run: |
          git config user.name "diag-bot"
          git config user.email "diag@example.com"
          git add works/apps/namaz-azan/buildlog.txt
          git commit -m "ci: compiler log [skip ci]" || exit 0
          git push
