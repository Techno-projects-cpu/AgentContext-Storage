name: probe
on:
  push:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          java -version 2>&1 | head -3
          which gradle && gradle -v | head -8 || echo "no gradle"
