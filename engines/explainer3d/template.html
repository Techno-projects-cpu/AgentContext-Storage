<!doctype html>
<!--
  EXPLAINER ENGINE — real CSS 3D, not a background video.

  What this is for: the "3D explainer" register — a stack of layers in space,
  each one lifting off, diving into the next, and snapping back. The whole thing
  is CSS `perspective` + `translate3d` + `rotateX/rotateY` + `preserve-3d`, driven
  by a seekable GSAP timeline. No WebGL, no imports, no model viewer — which
  matters because this box renders with a software GL stack and stalls on
  shader work.

  Honest note: there is no "Zack D Films" skill installed in this sandbox (only
  hyperframes, hyperframes-cli and media-use, and the skill registry is
  unreachable). This is the technique those videos are built on, written from
  scratch, not a vendored block.

  Engine rules that keep it renderable on 2 cores:
    * animate transform/opacity only — never `left`, `top`, `filter: blur()`
    * one `perspective` per scene, `transform-style: preserve-3d` on the chain
    * layers are absolutely positioned; the camera moves, the layout does not
    * no Math.random / Date.now — every frame must be identical on re-render
-->
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="./vendor/gsap.min.js"></script>
<style>
  @font-face { font-family:"Display"; font-weight:700; font-display:block;
    src:url("./assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Text"; font-weight:400; font-display:block;
    src:url("./assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Mono"; font-weight:500; font-display:block;
    src:url("./assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

  :root{
    --void:#07070b; --ink:#f4f6ff; --dim:#8b8fa6;
    --accent:#5b7cff; --hot:#c9ff3d; --rule:rgba(244,246,255,.16);
    --sans:"Display",sans-serif; --text:"Text",sans-serif; --mono:"Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);color:var(--ink);
    -webkit-font-smoothing:antialiased}
  #root{position:relative;width:100%;height:100%;overflow:hidden}

  /* ---- deep field: faint grid + vignette, fixed (never in the camera plane) ---- */
  .field{position:absolute;inset:-10%;pointer-events:none;
    background-image:
      linear-gradient(rgba(91,124,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,124,255,.10) 1px, transparent 1px);
    background-size:120px 120px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 30%, transparent 78%);
            mask-image:radial-gradient(circle at 50% 45%, #000 30%, transparent 78%);
  }
  .glow{position:absolute;width:1200px;height:1200px;left:50%;top:42%;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(91,124,255,.20), transparent 62%);}

  .scene{position:absolute;inset:0;opacity:0;
    perspective:900px;perspective-origin:50% 48%;}
  .scene[data-first]{opacity:1}
  .world{position:absolute;inset:0;transform-style:preserve-3d;}

  .hud{position:absolute;left:84px;right:84px;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:27px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);z-index:60}
  .hud.top{top:96px}
  .hud.bot{bottom:96px}
  .hud .live::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;
    background:var(--hot);margin-right:14px;box-shadow:0 0 18px var(--hot)}

  /* ---- layer plate: the unit of the explainer ---- */
  .plate{
    position:absolute;left:50%;top:50%;
    width:720px;
    padding:34px 38px;
    background:linear-gradient(160deg, rgba(24,28,44,.94), rgba(12,14,24,.94));
    border:2px solid rgba(91,124,255,.42);
    box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    transform-style:preserve-3d;
    will-change:transform,opacity;
  }
  .plate .tag{
    font-family:var(--mono);font-size:26px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);margin-bottom:18px;
  }
  .plate .line{font-family:var(--sans);font-weight:700;font-size:62px;line-height:1;
    letter-spacing:-.035em}
  .plate .note{font-family:var(--text);font-size:30px;line-height:1.4;color:var(--dim);margin-top:18px}
  .plate .hot{color:var(--hot)}

  /* the connector: a hairline that links two layers in space */
  /* links removed: as absolutely positioned 3px bars they read as stray rules
     across the frame rather than as connectors in depth */

  .hero{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    padding:0 84px;text-align:center;transform-style:preserve-3d;
  }
  .hero .kick{font-family:var(--mono);font-size:30px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);margin-bottom:26px}
  .hero h1{font-family:var(--sans);font-weight:700;font-size:132px;line-height:.93;letter-spacing:-.045em}
  .hero h1 em{font-style:normal;color:var(--hot)}
  .hero p{font-family:var(--text);font-size:38px;color:var(--dim);margin-top:32px;line-height:1.4}

  .mono{font-family:var(--mono)}

  /* ---- tunnel: rings receding to a vanishing point ---- */
  .ring{
    position:absolute;left:50%;top:50%;width:440px;height:440px;
    border:3px solid rgba(91,124,255,.5);border-radius:50%;
    transform-style:preserve-3d;
  }
  .tunnel-hero{z-index:5}
  .ring{opacity:0}
  .picks{display:flex;justify-content:center;gap:20px;margin-top:44px}
  .pick{
    font-family:var(--mono);font-size:34px;letter-spacing:.12em;
    padding:18px 26px;border:2px solid var(--hot);color:var(--hot);
    background:rgba(201,255,61,.07);transform-style:preserve-3d;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
  <div class="field"></div>
  <div class="glow"></div>
</div>

<!-- literal, with ids: the runtime parses source, not the live DOM -->
<audio id="vo" src="assets/vo.wav" preload="auto" data-start="0" data-volume="1"></audio>
<!-- Music bed is OPTIONAL. Leave this tag commented until assets/bed.wav exists:
     a missing src does not degrade, it renders a silent film. -->
<!-- <audio id="bed" src="assets/bed.wav" preload="auto" data-start="0" data-volume="0.11"
       data-fade-in="1.4" data-fade-out="1.8"></audio> -->

<script>
/* ============================ EDIT THIS ============================
   Chapters are the unit. Each chapter owns a "dive": the camera drops
   through a stack of plates along Z. `layers` are the plates in that
   stack, nearest last.
   =================================================================== */
const FILM = {
  brand: "NEZAAD",
  total: 24.000,
  chapters: [
    {
      start: 0.0, dur: 5.2, kind: "hero",
      kick: "Websites, built",
      head: "Websites built<br><em>to perform.</em>",
      sub: "Hand-written. No framework tax.",
    },
    {
      start: 5.2, dur: 6.6, kind: "dive",
      kick: "01 / The stack",
      layers: [
        { tag: "Semantic HTML", line: "Structure",  note: "meaning first, divs last" },
        { tag: "Modern CSS",    line: "Style",      note: "grid, custom properties" },
        { tag: "Vanilla JS",    line: "Behaviour",  note: "no framework required" },
        { tag: "No build step", line: "Ship",       note: "deploy the source" },
      ],
    },
    {
      start: 11.8, dur: 5.8, kind: "tunnel",
      kick: "02 / Performance",
      head: "Budgets set<br>before the code.",
      picks: ["LCP", "CLS", "INP"],
    },
    {
      start: 17.6, dur: 6.4, kind: "hero",
      kick: "Available for new work",
      head: "Let's build<br><em>the next one.</em>",
      sub: "zero-vast.vercel.app",
    },
  ],
};

const CRAFT = { crossfade: 0.32, enter: 0.7, ease: "expo.out" };
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ============================ markup ============================ */
function hud(i, s) {
  return `<div class="hud top"><span class="live">${esc(FILM.brand)}</span>
            <span>${String(i+1).padStart(2,"0")} / ${String(FILM.chapters.length).padStart(2,"0")}</span></div>
          <div class="hud bot"><span>${esc(s.kick || "")}</span><span>3D · 1080 × 1920</span></div>`;
}

function heroBody(s) {
  return `<div class="hero">
      <div class="kick">${esc(s.kick)}</div>
      <h1>${s.head}</h1>
      ${s.sub ? `<p>${esc(s.sub)}</p>` : ""}
    </div>`;
}

function diveBody(s) {
  // Plates sit at fixed Z depths, alternating left/right and climbing. The
  // CAMERA never translates the world — each plate animates its own Z toward
  // the viewer and then leaves. Translating the whole world was the bug: it
  // pushed plates behind the viewer, where they vanish or magnify off-frame.
  const plates = s.layers.map((L, k) => {
    const dx = k % 2 ? 96 : -96;
    const dy = (k - (s.layers.length - 1) / 2) * 96;
    const rot = k % 2 ? 6 : -6;
    return `<div class="plate" data-k="${k}"
        style="transform:translate(-50%,-50%) translate3d(${dx}px,${dy}px,${-1600 - k * 700}px) rotateY(${rot}deg)">
        <div class="tag">${esc(L.tag)}</div>
        <div class="line">${esc(L.line)}</div>
        <div class="note">${esc(L.note)}</div>
      </div>`;
  }).join("");
  return `<div class="world" data-world>${plates}</div>`;
}

function tunnelBody(s) {
  // a corridor of rings receding to a vanishing point, then three picks punch through
  const rings = Array.from({length: 7}, (_, k) =>
    `<div class="ring" data-k="${k}" style="transform:translate(-50%,-50%) translateZ(${-200 * k}px);
        border-color:rgba(91,124,255,${(0.55 - k*0.05).toFixed(2)})"></div>`).join("");
  const picks = (s.picks||[]).map((p,k) =>
    `<div class="pick" data-k="${k}">${esc(p)}</div>`).join("");
  return `<div class="world" data-world>${rings}</div>
    <div class="hero tunnel-hero">
      <div class="kick">${esc(s.kick)}</div>
      <h1>${s.head}</h1>
      <div class="picks">${picks}</div>
    </div>`;
}

const root = document.getElementById("root");
root.dataset.duration = String(FILM.total);
root.insertAdjacentHTML("beforeend", FILM.chapters.map((s,i) => {
  const last = i === FILM.chapters.length - 1;
  const clipDur = last ? s.dur : s.dur + CRAFT.crossfade;
  const body = s.kind === "dive" ? diveBody(s)
             : s.kind === "tunnel" ? tunnelBody(s)
             : heroBody(s);
  return `<section class="scene" id="ch-${i}" data-start="${s.start}"
             data-duration="${clipDur}" ${i===0?"data-first":""}>
            ${hud(i,s)}
            ${body}
          </section>`;
}).join(""));

/* ============================ timeline ============================
   The camera is a single object in 3D space. Each chapter moves it; the
   plates and rings are already positioned, we only fly past them.
   Transform/opacity only — anything else snaps or stalls the capture.
   ================================================================ */
const tl = gsap.timeline({ paused: true });

FILM.chapters.forEach((s, i) => {
  const sel = `#ch-${i}`;
  const t0 = s.start;

  if (i === 0) tl.set(sel, { opacity: 1 }, 0);
  else tl.fromTo(sel, { opacity: 0 },
         { opacity: 1, duration: CRAFT.crossfade, ease: "power2.out" }, t0);

  /* ---------- hero: slow orbit, type comes from depth ---------- */
  if (s.kind === "hero") {
    tl.fromTo(`${sel} .hero`,
      { z: -260, rotateX: 9, opacity: 0 },
      { z: 0, rotateX: 0, opacity: 1, duration: 1.0, ease: CRAFT.ease }, t0);
    // the camera keeps creeping after the type lands: parallax without a cut
    tl.fromTo(`${sel}`, { rotateY: -3 }, { rotateY: 3, duration: s.dur, ease: "sine.inOut" }, t0);
    // no letter-spacing tween: layout properties reflow and stutter under capture
    tl.fromTo(`${sel} .kick`, { y: 22, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.9, ease: "power2.out" }, t0 + 0.15);
  }

  /* ---------- dive: plates fly past a fixed camera, one beat each ---------- */
  if (s.kind === "dive") {
    const n = s.layers.length;
    const per = (s.dur - 0.55) / n;

    for (let k = 0; k < n; k++) {
      const at = t0 + 0.15 + per * k;
      const dx = k % 2 ? 96 : -96;
      const dy = (k - (n - 1) / 2) * 96;
      const rot = k % 2 ? 6 : -6;

      // One beat per plate: arrive by 45% of the beat, HOLD until 78%, then
      // leave. The hold is the whole point — without it a plate is still
      // shrinking back toward the vanishing point when the next one arrives,
      // and every frame looks like a mid-transition rather than a shot.
      tl.fromTo(`${sel} .plate[data-k="${k}"]`,
        { z: -1500 - k * 600, opacity: 0, rotateY: k % 2 ? 26 : -26 },
        { z: -180, opacity: 1, rotateY: rot,
          duration: per * 0.45, ease: "power2.out" }, at);

      // leave toward the viewer, fading out before it can reach the lens
      tl.to(`${sel} .plate[data-k="${k}"]`,
        { z: 150, opacity: 0, duration: per * 0.22, ease: "power2.in" },
        at + per * 0.78);
    }
  }

  /* ---------- tunnel: corridor of rings, then the picks punch through ---------- */
  if (s.kind === "tunnel") {
    // full-frame effect: the top HUD row would sit on the rings, so it steps
    // back — but the bottom row stays, or the chapter loses its chrome entirely
    tl.to(`${sel} .hud.top`, { opacity: 0, duration: 0.4, ease: "power2.out" }, t0);
    tl.to(`${sel} .hud.top`, { opacity: 1, duration: 0.4, ease: "power2.in" }, t0 + s.dur - 1.2);
    tl.fromTo(`${sel} [data-world]`, { z: -120 },
      { z: 240, duration: s.dur - 1.1, ease: "power1.in" }, t0 + 0.1);
    tl.fromTo(`${sel} .ring`, { opacity: 0, rotate: 0, scale: 1.25 },
      { opacity: 0.55, rotate: 12, scale: 1, duration: 0.55, ease: "power2.out", stagger: 0.07 }, t0 + 0.25);
    // rings must not pile up over the HUD rows near the end of the tunnel
    tl.to(`${sel} .ring`, { opacity: 0, duration: 0.8, stagger: 0.07, ease: "power2.in" }, t0 + s.dur - 1.3);
    // type holds its plane: rings recede past it, it does not fly forward
    tl.fromTo(`${sel} .tunnel-hero`, { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: 0.85, ease: CRAFT.ease }, t0 + 0.5);
    tl.set(`${sel} .tunnel-hero`, { z: 0 }, t0);
    tl.fromTo(`${sel} .pick`, { y: 30, opacity: 0, rotateX: 32 },
      { y: 0, opacity: 1, rotateX: 0, duration: 0.55, ease: "back.out(1.7)",
        stagger: 0.28 }, t0 + 1.5);
  }

  tl.to(sel, { opacity: 0, duration: CRAFT.crossfade, ease: "power2.inOut" }, t0 + s.dur);
});

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
