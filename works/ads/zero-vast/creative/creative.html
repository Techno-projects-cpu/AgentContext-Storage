<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One file drives every static creative. ?id=<creative id>&w=&h= picks the artboard.
     Rendered headlessly to PNG. Fonts are self-hosted; no network at render time. -->
<title>NEZAAD ad creative</title>
<style>
  @font-face{font-family:"Display";font-weight:700;font-display:block;src:url("./assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2")}
  @font-face{font-family:"Display";font-weight:500;font-display:block;src:url("./assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2")}
  @font-face{font-family:"Text";font-weight:400;font-display:block;src:url("./assets/fonts/inter-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Mono";font-weight:500;font-display:block;src:url("./assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2")}

  :root{
    --paper:#f4f2ec; --ink:#111110; --soft:#5c5c54;
    --rule:#cfcbbf; --accent:#1b4dff;
    --mono:"Mono",ui-monospace,monospace; --sans:"Display",sans-serif; --text:"Text",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper)}
  body{color:var(--ink);-webkit-font-smoothing:antialiased}
  .art{position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
  /* hairline grid, exactly as on the site: rules, not gradients */
  .art::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px);
    background-size:var(--colm,120px) 100%;opacity:.5}
  .pad{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
       padding:var(--pad,84px)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;
       font-family:var(--mono);font-size:var(--micro,26px);letter-spacing:.16em;
       text-transform:uppercase;color:var(--soft)}
  .top b{color:var(--ink);font-weight:500}
  .mark{display:flex;align-items:center;gap:14px}
  .dot{width:12px;height:12px;background:var(--accent)}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--gap,34px);
       padding-top:var(--headclear,28px)}
  /* tall boards: a deliberate block up top and the rows pinned to the lower third,
     with the paper breathing between them — not a stray gap and not a collision. */
  .mid.spread{justify-content:flex-start;gap:0}
  .mid.spread .kicker{margin-top:var(--spreadtop,120px)}
  .mid.spread h1{margin-top:var(--gap,34px)}
  .mid.spread .sub{margin-top:var(--gap,34px)}
  .mid.spread .rows{margin-top:auto;margin-bottom:var(--spreadbot,40px)}
  .kicker{font-family:var(--mono);font-size:var(--micro,26px);letter-spacing:.2em;
          text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--sans);font-weight:700;font-size:var(--h1,150px);line-height:.92;
     letter-spacing:-.035em}
  h1 em{font-style:normal;color:var(--soft)}
  .sub{font-family:var(--text);font-size:var(--sub,40px);line-height:1.42;color:var(--soft);
       max-width:var(--subw,30ch)}
  .rule{height:1px;background:var(--rule)}
  .rows{display:flex;flex-direction:column;gap:0}
  .row{display:flex;gap:26px;align-items:baseline;padding:var(--rowpad,22px) 0;
       border-top:1px solid var(--rule);font-family:var(--text);font-size:var(--row,34px)}
  .row:last-child{border-bottom:1px solid var(--rule)}
  .row .n{font-family:var(--mono);font-size:var(--micro,26px);color:var(--accent);
          letter-spacing:.1em;min-width:3.2em}
  .row .t{font-family:var(--sans);font-weight:500;letter-spacing:-.02em}
  .row .d{margin-left:auto;color:var(--soft);font-size:var(--rowd,28px);text-align:right}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--bottongap,40px);margin-top:var(--bottontop,54px);
          font-family:var(--mono);font-size:var(--micro,26px);letter-spacing:.12em;
          text-transform:uppercase;color:var(--soft)}
  .cta{display:inline-flex;align-items:center;gap:18px;font-family:var(--sans);
       font-weight:500;font-size:var(--ctas,34px);letter-spacing:-.01em;color:var(--ink);
       max-width:62%}
  .cta span{border-bottom:2px solid var(--ink);padding-bottom:6px}
  .url{font-family:var(--mono);font-size:var(--urls,28px);letter-spacing:.06em;color:var(--ink)}
  /* ink theme: the live site's own tokens — near-black ground, paper type,
     and its signature outlined display line instead of a grey one. */
  .art.ink{--paper:#070707;--ink:#f4f3ee;--soft:#a6a6a1;--rule:rgba(255,255,255,.16);background:#070707;color:#f4f3ee}
  .art.ink::before{background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px);opacity:1}
  .art.ink h1 em{color:transparent;-webkit-text-stroke:2px #f4f3ee;font-weight:500}
  .art.ink .dot{background:#f4f3ee}
  .art.ink .cta span{border-color:#f4f3ee}
  .art.ink .cta,.art.ink .url,.art.ink .top b{color:#f4f3ee}
  /* the one inverted board */
  .art.dark{background:var(--ink);color:var(--paper)}
  .art.dark::before{background-image:linear-gradient(to right,rgba(255,255,255,.12) 1px,transparent 1px)}
  .art.dark .sub,.art.dark .top,.art.dark .bottom,.art.dark h1 em{color:#9a9a92}
  .art.dark .top b,.art.dark .cta,.art.dark .url,.art.dark .row .t{color:var(--paper)}
  .art.dark .cta span{border-color:var(--paper)}
  .art.dark .dot{background:var(--accent)}
  .art.dark .row{border-color:rgba(255,255,255,.16)}
  .art.dark .row:last-child{border-bottom-color:rgba(255,255,255,.16)}
  .art.dark .rule{background:rgba(255,255,255,.16)}
  .art.dark .cta span{border-color:var(--paper)}
</style>
</head>
<body>
<div class="art" id="art"><div class="pad" id="pad"></div></div>

<script>
const Q = new URLSearchParams(location.search);
const ID = Q.get("id") || "speed-feed-1x1";
const W  = +(Q.get("w") || 1080), H = +(Q.get("h") || 1080);
const art = document.getElementById("art");
art.style.width = W + "px"; art.style.height = H + "px";

/* Scale: every board is authored at a 1080 reference and then scaled by size,
   so a 4x5 and a 1x1 stay visually consistent without per-size hand work. */
const S = Math.min(W, H) / 1080;
const P = (n) => Math.round(n * S);
document.documentElement.style.setProperty("--pad", P(W < 1000 ? 56 : 84) + "px");
art.style.setProperty("--colm", P(120) + "px");
art.style.setProperty("--micro", P(26) + "px");
art.style.setProperty("--gap", P(34) + "px");

const brand = `<div class="mark"><i class="dot"></i><b>NEZAAD</b>&nbsp;Industries</div>`;
const URLTXT = "zero-vast.vercel.app";

const boards = {
  /* ---------- h1: speed to lead ---------- */
  "speed-feed-1x1": {dark:false, h1:118, sub:34,
    kicker:"01 / Speed", top:["Khammam, Telangana","01 — Speed"],
    h1html:`Your site<br>is too slow.<br><em>They leave.</em>`,
    sub:"A page that takes three seconds to appear has already lost the visitor. Weight budgets are set before the first commit.",
    rows:[["01","Hand-written","No framework tax"],["02","Weight budget","LCP · CLS · INP"],["03","Source code","Yours at handover"]],
    cta:"Start a project", url:true},

  "speed-feed-4x5": {dark:false, h1:158, sub:40,
    kicker:"01 / Speed",
    h1html:`Your site<br>is too slow.<br><em>They leave.</em>`,
    sub:"A page that takes three seconds to appear has already lost the visitor. Every build starts from a weight budget, not a template.",
    rows:[["01","Hand-written","Semantic HTML, CSS, vanilla JS"],["02","Weight budget","LCP · CLS · INP, agreed first"],["03","Handover","Repository and deploy steps"]],
    cta:"Start a project", url:true},

  "speed-story-9x16": {dark:false, h1:176, sub:38, spread:true,
    kicker:"01 / Speed",
    h1html:`Three<br>seconds<br><em>is too long.</em>`,
    sub:"Your customers don't complain about a slow site. They leave.",
    rows:[["01","Hand-written"],["02","Weight budget"],["03","Yours at handover"]],
    cta:"Start a project", url:false},

  "speed-wide-1.91x1": {dark:true, h1:120, sub:34,
    kicker:"01 / Speed",
    h1html:`Your site is too slow.<br><em>They leave.</em>`,
    sub:"Weight budgets before the first commit. Hand-written HTML, CSS and JavaScript.",
    rows:[],
    cta:"Start a project", url:true},

  /* ---------- h2: ownership ---------- */
  "ownership-feed-1x1": {dark:false, h1:112, sub:33,
    kicker:"02 / Ownership",
    h1html:`Can you edit<br>your own site?<br><em>You should.</em>`,
    sub:"Repository, deploy steps and a walkthrough at handover. Hosting registered in your name and billed at cost.",
    rows:[["01","The code","No lock-in"],["02","Hosting","In your name"],["03","Markup","Zero"]],
    cta:"What handover includes", url:true},

  "ownership-wide-1.91x1": {dark:false, h1:132, sub:34,
    kicker:"02 / Ownership",
    h1html:`The site is yours outright.<br><em>Code, deploy steps, no lock-in.</em>`,
    sub:"",
    rows:[],
    cta:"See what handover includes", url:true},

  /* ---------- h3: limits ---------- */
  "limits-feed-1x1": {dark:true, h1:118, sub:34,
    kicker:"03 / The limits",
    h1html:`Four things<br>I won't do.`,
    sub:"",
    rows:[["01","Sell a template","as custom work"],["02","Add a framework","you don't need"],["03","Ship code I can't","explain line by line"],["04","Invoice for work","you didn't approve"]],
    cta:"Read the limits", url:true},

  "limits-4x5": {dark:false, h1:140, sub:38,
    kicker:"03 / The limits",
    h1html:`Four things<br><em>I won't do.</em>`,
    sub:"",
    rows:[["01","Sell a template","as custom work"],["02","Add a framework","you don't need"],["03","Ship code I can't","explain line by line"],["04","Invoice for work","you didn't approve"]],
    cta:"Read the limits", url:true},
};

const THEME = Q.get("theme") || "paper";
const b = boards[ID] || boards["speed-feed-1x1"];
if (THEME === "ink") art.classList.add("ink");
else if (b.dark) art.classList.add("dark");
art.style.setProperty("--h1", P(b.h1) + "px");
art.style.setProperty("--sub", P(b.sub) + "px");
art.style.setProperty("--subw", (W < 1400 ? 26 : 34) + "ch");
art.style.setProperty("--ctas", P(32) + "px");
art.style.setProperty("--urls", P(26) + "px");
art.style.setProperty("--spreadtop", P(150) + "px");
art.style.setProperty("--spreadbot", P(70) + "px");
art.style.setProperty("--headclear", P(W <= H ? 34 : 16) + "px");
art.style.setProperty("--bottongap", P(W <= H ? 28 : 60) + "px");
art.style.setProperty("--bottontop", P(W <= H ? 54 : 32) + "px");
art.style.setProperty("--ctas", P(W < 900 ? 26 : 32) + "px");

document.getElementById("pad").innerHTML = `
  <div class="top"><span>Khammam · Telangana</span>${brand}</div>
  <div class="mid${b.spread ? " spread" : ""}">
    <div class="kicker">${b.kicker}</div>
    <h1>${b.h1html}</h1>
    ${b.sub ? `<p class="sub">${b.sub}</p>` : ""}
    ${b.rows.length ? `<div class="rows">${b.rows.map(r =>
        `<div class="row"><span class="n">${r[0]}</span><span class="t">${r[1]}</span>` +
        (r[2] ? `<span class="d">${r[2]}</span>` : "") + `</div>`).join("")}</div>` : ""}
  </div>
  <div class="bottom">
    <span class="cta"><span>${b.cta}</span> ↗</span>
    ${b.url ? `<span class="url">${URLTXT}</span>` : `<span>Hand-written · 2026</span>`}
  </div>`;

/* Signal readiness to the renderer: fonts resolved, layout settled. */
Promise.all([
  document.fonts.load('700 100px "Display"'),
  document.fonts.load('400 40px "Text"'),
  document.fonts.load('500 26px "Mono"'),
]).then(() => document.fonts.ready).then(() => { window.__ready = true; });
</script>
</body>
</html>
