<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  MAX WORLD — localised ad system. One file, four graphic languages, chosen by
  ?lang=en|te|hi|ur.

  Rendered by HyperFrames in real Chrome, so HarfBuzz shapes every script:
  Telugu (Ramabhadra), Devanagari (Rozha One / Hind) and Urdu Nastaliq (Noto
  Nastaliq Urdu). No pre-rendered text stamps, no manual shaping.

  Facts are the shop's, from lib/site.ts: name, address, hours, phone, the four
  brands, free site survey, laptop sales & service. No prices, no client counts,
  no testimonials — none exist.

  Timing is one beat grid at 110 BPM: cuts at 3.27 / 8.74 / 13.11; brand chips
  at 4.91 / 5.34 / 6.00 / 6.56; bong at 8.74; phone punch at 17.47; 20.0 s total.

  Every frame is a pure function of time — no Math.random, no Date.now.
-->
<style>
  @font-face { font-family: "Space"; font-display: block;
    src: url("./assets/fonts/SpaceGrotesk.ttf") format("truetype"); }
  @font-face { font-family: "Ram"; font-display: block;
    src: url("./assets/fonts/Ramabhadra-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Rozha"; font-display: block;
    src: url("./assets/fonts/RozhaOne-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Hind"; font-weight: 600; font-display: block;
    src: url("./assets/fonts/Hind-SemiBold.ttf") format("truetype"); }
  @font-face { font-family: "Hind"; font-weight: 400; font-display: block;
    src: url("./assets/fonts/Hind-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Nast"; font-display: block;
    src: url("./assets/fonts/NotoNastaliqUrdu.ttf") format("truetype"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #0e0d0a; color: #faf9f6;
    -webkit-font-smoothing: antialiased;
  }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

  :root {
    --paper: #faf9f6;
    --brand: #e30613;
    --accent: #e30613;
    --accent-dim: rgba(227, 6, 19, 0.38);
    --muted: rgba(250, 249, 246, 0.58);
    --lane: 84px;
  }

  /* ---- product photography: blurred fill under a sharp plate ---- */
  .bgfill { position: absolute; inset: -80px; z-index: 0; }
  .bgfill img { width: 100%; height: 100%; object-fit: cover; }
  .plate { position: absolute; inset: 0; z-index: 1; }
  .plate img { width: 100%; height: 100%; object-fit: cover; }
  .plate::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 50% 40%, transparent 20%, rgba(0,0,0,.55) 100%); }
  .bgtint { position: absolute; inset: 0; z-index: 2; }

  /* ---- viewfinder chrome ---- */
  .vf { position: absolute; inset: 56px; pointer-events: none; z-index: 40; }
  .vf .cnr { position: absolute; width: 64px; height: 64px; border: 4px solid var(--paper); }
  .vf .cnr.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  .vf .cnr.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  .vf .cnr.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  .vf .cnr.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }

  .hud {
    position: absolute; left: var(--lane); right: var(--lane); top: 96px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Space", monospace; font-weight: 700;
    font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--paper); z-index: 45;
  }
  .hud .rec { display: inline-flex; align-items: center; gap: 14px; }
  .hud .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--brand);
    box-shadow: 0 0 22px rgba(227, 6, 19, 0.85); }
  .hudfoot {
    position: absolute; left: var(--lane); right: var(--lane); bottom: 96px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: "Space", monospace; font-weight: 700;
    font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); z-index: 45;
  }

  .logo { position: absolute; z-index: 45; display: flex; align-items: center; gap: 18px; }
  .logo .sym { width: 68px; height: 61px; }
  .logo .name { font-family: "Space", sans-serif; font-weight: 700;
    font-size: 40px; letter-spacing: -0.02em; color: var(--paper); }
  .logo .name i { font-style: normal; color: var(--brand); }

  /* ---- scenes ---- */
  .scene { position: absolute; inset: 0; opacity: 0; z-index: 10; }
  .scene[data-first] { opacity: 1; }
  #s1::before, #s4::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(14,13,10,.80) 0%, rgba(14,13,10,.62) 42%, rgba(14,13,10,.92) 100%);
  }
  #s3::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(14,13,10,.93) 0%, rgba(14,13,10,.88) 50%, rgba(14,13,10,.96) 100%);
  }
  body[data-lang="te"] #s1::before, body[data-lang="te"] #s4::before { background: linear-gradient(180deg, rgba(23,17,10,.82) 0%, rgba(23,17,10,.64) 42%, rgba(23,17,10,.93) 100%); }
  body[data-lang="hi"] #s1::before, body[data-lang="hi"] #s4::before { background: linear-gradient(180deg, rgba(38,16,16,.82) 0%, rgba(38,16,16,.64) 42%, rgba(38,16,16,.93) 100%); }
  body[data-lang="ur"] #s1::before, body[data-lang="ur"] #s4::before { background: linear-gradient(180deg, rgba(15,27,19,.84) 0%, rgba(15,27,19,.66) 42%, rgba(15,27,19,.94) 100%); }
  body[data-lang="te"] #s3::before { background: linear-gradient(180deg, rgba(23,17,10,.94) 0%, rgba(23,17,10,.89) 50%, rgba(23,17,10,.97) 100%); }
  body[data-lang="hi"] #s3::before { background: linear-gradient(180deg, rgba(38,16,16,.94) 0%, rgba(38,16,16,.89) 50%, rgba(38,16,16,.97) 100%); }
  body[data-lang="ur"] #s3::before { background: linear-gradient(180deg, rgba(15,27,19,.94) 0%, rgba(15,27,19,.89) 50%, rgba(15,27,19,.97) 100%); }

  .hook-type .l1, .hook-type .l2, .hook-type .l3 {

  .hook-type .l1, .hook-type .l2 { color: var(--paper); }
  .hook-type .l3 { color: var(--accent); }
  body[data-lang="te"] .hook-type .l1, body[data-lang="te"] .hook-type .l2,
  body[data-lang="te"] .hook-type .l3 { font-family: "Ram", sans-serif; font-size: 108px; line-height: 1.34; letter-spacing: 0; }
  body[data-lang="hi"] .hook-type .l1, body[data-lang="hi"] .hook-type .l2,
  body[data-lang="hi"] .hook-type .l3 { font-family: "Rozha", serif; font-size: 116px; line-height: 1.32; letter-spacing: 0; }
  body[data-lang="ur"] .hook-type .l1, body[data-lang="ur"] .hook-type .l2,
  body[data-lang="ur"] .hook-type .l3 { font-family: "Nast", serif; font-size: 92px; line-height: 1.9; letter-spacing: 0; direction: rtl; }
  body[data-lang="ur"] .hook-type .kick { font-family: "Nast", serif; font-size: 34px; line-height: 2.1;
    letter-spacing: 0; direction: rtl; text-transform: none; opacity: 1; color: var(--accent); text-align: right; }
  body[data-lang="te"] .hook-type .kick { font-family: "Ram", sans-serif; font-size: 32px;
    letter-spacing: 0; text-transform: none; opacity: 1; color: var(--accent); }
  body[data-lang="hi"] .hook-type .kick { font-family: "Hind", sans-serif; font-weight: 600;
    font-size: 32px; letter-spacing: 0.02em; text-transform: none; opacity: 1; color: var(--accent); }

  .tagline { position: absolute; left: var(--lane); right: var(--lane); bottom: 300px;
    font-size: 34px; line-height: 1.5; color: var(--muted); z-index: 20; }
  body[data-lang="en"] .tagline { font-family: "Space", sans-serif; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; }
  body[data-lang="te"] .tagline { font-family: "Ram", sans-serif; font-size: 38px; color: var(--paper); }
  body[data-lang="hi"] .tagline { font-family: "Hind", sans-serif; font-weight: 600; font-size: 38px; color: var(--paper); }
  body[data-lang="ur"] .tagline { font-family: "Nast", serif; font-size: 40px; line-height: 1.9;

  /* ---- S2 ---- */
  .lockup { position: absolute; inset: 0; display: flex; flex-direction: column;

  body[data-lang="hi"] .lockup .payoff { font-family: "Rozha", serif; font-size: 46px; color: var(--paper); }

  .chip { font-family: "Space", monospace; font-weight: 700; font-size: 32px;

  body[data-lang="hi"] .rows .roof { font-family: "Rozha", serif; font-size: 66px; line-height: 1.2; }

  .row { position: absolute; left: var(--lane); right: var(--lane); }
  .row .num { font-family: "Space", monospace; font-weight: 700; font-size: 30px;
    color: var(--accent); letter-spacing: 0.1em; }
  .row .t1 { margin-top: 12px; font-weight: 700; color: var(--paper); }
  .row .t2 { margin-top: 10px; color: var(--muted); }
  body[data-lang="en"] .row .t1 { font-family: "Space", sans-serif; font-weight: 700; font-size: 44px;
    line-height: 1.18; text-transform: uppercase; letter-spacing: -0.01em; }
  body[data-lang="en"] .row .t2 { font-family: "Space", sans-serif; font-size: 32px; line-height: 1.42; }
  body[data-lang="te"] .row .t1 { font-family: "Ram", sans-serif; font-size: 42px; line-height: 1.55; }
  body[data-lang="te"] .row .t2 { font-family: "Ram", sans-serif; font-size: 33px; line-height: 1.75; }
  body[data-lang="hi"] .row .t1 { font-family: "Hind", sans-serif; font-weight: 600; font-size: 44px; line-height: 1.46; }
  body[data-lang="hi"] .row .t2 { font-family: "Hind", sans-serif; font-weight: 400; font-size: 33px; line-height: 1.62; }
  body[data-lang="ur"] .row { padding-right: 34px; border-right: 4px solid var(--accent-dim); }
  body[data-lang="ur"] .row .num { display: block; text-align: right; }
  body[data-lang="ur"] .row .t1 { font-family: "Nast", serif; font-size: 42px; line-height: 2.15;

  body[data-lang="ur"] .row .t2 { font-family: "Nast", serif; font-size: 34px; line-height: 2.15;

  body[data-lang="te"] .cta .outro { font-family: "Ram", sans-serif; font-size: 74px; line-height: 1.3; }
  body[data-lang="hi"] .cta .outro { font-family: "Rozha", serif; font-size: 78px; line-height: 1.22; }

  body[data-lang="en"] .meta .bottom { font-family: "Space", sans-serif; font-weight: 700;

  .bookframe { position: absolute; inset: 30px; border: 3px solid var(--accent-dim); z-index: 8; }

  body[data-lang="hi"] .vf .cnr { border-width: 7px; border-color: var(--accent); width: 78px; height: 78px; }

  body[data-lang="ur"] .vf { display: none; }
  body[data-lang="ur"] .bookframe { display: block; }

</style>
